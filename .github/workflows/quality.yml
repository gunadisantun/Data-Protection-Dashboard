name: Quality and Security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVACY_BRO_OFFLINE: "1"
      PRIVACY_BRO_DATA_DIR: ${{ runner.temp }}/privacy-bro-build
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # review-integrity.test.ts creates its own disposable PGlite database.
      # No production database credentials are available to this job.
      - run: npm run test
      - run: npm run build
